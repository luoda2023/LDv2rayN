name: sign and upload release files

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      file_pattern:
        required: false
        type: string
        default: '**/*'
      content_type:
        required: false
        type: string
        default: application/octet-stream
    secrets:
      # 仓库未配置该 secret 时不再报错，改为「跳过签名、只发布文件」。
      # 想恢复签名：生成 GPG 密钥后把私钥写入仓库 secret GPG_PRIVATE_KEY 即可，
      # 无需再改本文件（HAS_GPG_KEY 会自动变 true）。
      GPG_PRIVATE_KEY:
        required: false

permissions:
  contents: write
  actions: read

jobs:
  upload:
    runs-on: ubuntu-26.04
    env:
      # 有私钥 -> true（签名）；没有 -> false（未签名发布）
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
    - name: Download release artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact_name }}
        path: dist

    - name: Import GPG private key
      if: env.HAS_GPG_KEY == 'true'
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      run: |
        set -euo pipefail
        install -m 700 -d ~/.gnupg
        printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

    - name: Sign release files
      if: env.HAS_GPG_KEY == 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd dist
        shopt -s globstar nullglob
        files=( ${{ inputs.file_pattern }} )
        (( ${#files[@]} )) || { echo "No files matched: ${{ inputs.file_pattern }}"; exit 1; }
        for f in "${files[@]}"; do
          [[ -f "$f" ]] || continue
          gpg --batch --yes --armor --detach-sign --output "$f.sig" "$f"
        done

    - name: Upload release files
      uses: svenstaro/upload-release-action@v2
      with:
        file: dist/${{ inputs.file_pattern }}
        tag: ${{ inputs.release_tag }}
        file_glob: true
        prerelease: true
        overwrite: true

    - name: Upload release signatures
      if: env.HAS_GPG_KEY == 'true'
      uses: svenstaro/upload-release-action@v2
      with:
        file: dist/${{ inputs.file_pattern }}.sig
        tag: ${{ inputs.release_tag }}
        file_glob: true
        prerelease: true
        overwrite: true
