name: publish GPG public key

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      # 未配置时整个「发布签名公钥」流程自动跳过（不再报错）
      GPG_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    env:
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
    - name: Import GPG private key
      if: env.HAS_GPG_KEY == 'true'
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      run: |
        set -euo pipefail
        install -m 700 -d ~/.gnupg
        printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

    - name: Export GPG public key
      if: env.HAS_GPG_KEY == 'true'
      shell: bash
      run: |
        set -euo pipefail
        fingerprint="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')"
        [[ -n "$fingerprint" ]] || { echo "No GPG secret key found."; exit 1; }
        gpg --batch --armor --export "$fingerprint" > v2rayN-public-key.asc

    - name: Upload GPG public key to release
      if: env.HAS_GPG_KEY == 'true'
      uses: svenstaro/upload-release-action@v2
      with:
        file: v2rayN-public-key.asc
        tag: ${{ inputs.release_tag }}
        prerelease: true
        overwrite: true
